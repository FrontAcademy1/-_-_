<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPRIX AI</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>SPRIX AI Learning Assistant</h1><section><h2>تسجيل الدخول</h2><input id="student" placeholder="كود الطالب"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">تسجيل الدخول</button><p id="msg"></p></section><section id="sec" hidden><h2>اختر القسم</h2><select id="sections"></select><button onclick="selectSection()">فتح القسم</button></section><section id="solve" hidden><h2>الحل</h2><button onclick="solve()">🤖 حل السؤال الحالي بالـAI</button><h3>السؤال</h3><pre id="q"></pre><h3>إجابة الـAI</h3><pre id="a"></pre><small>النسخة تعرض الحل ولا تضغط زر التسليم تلقائيًا.</small></section><section><h3>السجل</h3><pre id="log"></pre></section></main><script>const $=x=>document.getElementById(x);async function post(u,d){return await(await fetch(u,{method:'POST',body:d})).json()}async function login(){let d=new FormData();d.append('student_id',$('student').value);d.append('password',$('password').value);$('msg').textContent='جاري الدخول...';let x=await post('/api/login',d);$('msg').textContent=x.error||'تم الدخول';if(x.ok){$('sec').hidden=false;fill(x.sections||[])}refresh()}function fill(a){$('sections').innerHTML='';for(let x of a){let o=document.createElement('option');o.value=x.url;o.textContent=x.name||x.url;$('sections').appendChild(o)}}async function selectSection(){let d=new FormData();d.append('url',$('sections').value);let x=await post('/api/select-section',d);if(x.ok)$('solve').hidden=false;else alert(x.error);refresh()}async function solve(){$('a').textContent='جاري الحل...';let x=await post('/api/solve',new FormData());$('q').textContent=x.question||'';$('a').textContent=x.answer||x.message||x.error||'';refresh()}async function refresh(){try{let x=await(await fetch('/api/status')).json();$('log').textContent=(x.logs||[]).join('\n')}catch{}}setInterval(refresh,3000)</script></body></html>
